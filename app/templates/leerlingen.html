
{% extends "base.html" %}

{% block title %}Leerlingen{% endblock %}

{% block content %}

<!-- ===== PAGINA HEADER ===== -->
<h1>Leerlingen</h1>
<p>Kies een leerling om de details te bekijken:</p>

<!-- ===== ZOEK/FILTER PANEL ===== -->
<div class="search-panel">
  <!-- KLAS SNELFILTER KNOPPEN -->
  <div class="class-filter-buttons">
    <button type="button" onclick="setClassFilter('')">Alle</button>
    <button type="button" onclick="setClassFilter('3')">Klas 3</button>
    <button type="button" onclick="setClassFilter('4')">Klas 4</button>
  </div>

  <!-- ZOEKBALK: Zoek op naam en klas -->
  <div class="search-input">
    <label for="searchInput">Zoek op naam:</label>
    <input 
      id="searchInput" 
      type="text" 
      placeholder="Type naam of klas..." 
      oninput="filterLeerlingen()" 
    />
  </div>

  <!-- FILTER DROPDOWN: Filter op specifieke klas -->
  <div class="filter-input">
    <label for="klasFilter">Filter op klas:</label>
    <select id="klasFilter" onchange="filterLeerlingen()">
      <!-- Default: alle klassen zichtbaar -->
      <option value="">Alle klassen</option>
      
      <!-- Dynamisch gegenereerde klas options -->
      {% for klas in klassen %}
        <option value="{{ klas }}">{{ klas }}</option>
      {% endfor %}
    </select>
  </div>
</div>

<!-- ===== LEERLINGEN LIJST ===== -->
<!-- UL list met alle leerlingen (filterbaar) -->
<ul id="leerlingenLijst" class="leerlingen-lijst">
  {% for leerling in leerlingen %}
    <!-- 
      LI item met data-attributes voor filtering
      - data-klas: Klasnaam (voor class filter matching)
      - data-naam: Leerlingnaam (voor search matching)
    -->
    <li 
      data-klas="{{ leerling.klas }}" 
      data-naam="{{ leerling.naam }}" 
      class="leerling-item"
    >
      <!-- Link naar detail pagina -->
      <a 
        class="leerling-link" 
        href="{{ url_for('main.leerling_detail', leerling_id=leerling.id) }}"
      >
        <!-- Naam en klas in badge -->
        {{ leerling.naam }} <span class="leerling-klas">({{ leerling.klas }})</span>
      </a>
    </li>
  {% endfor %}
</ul>

<!-- ===== FILTER JAVASCRIPT ===== -->
<script>
/*
  Function: filterLeerlingen()
  Doel: Real-time client-side filtering van leerlingen op naam en klas
  
  Flow:
    1. Lees zoektekst van #searchInput
    2. Lees geselecteerde klas van #klasFilter
    3. Itereer door alle #leerlingenLijst items
    4. Voor elk item:
       a. Extraheer data-klas en data-naam attributes
       b. Controleer of zoektekst in naam/klas voorkomt
       c. Controleer of klas filter matcht (of filter is leeg)
       d. Zet display:none als filter niet matcht, anders show
  
  Complexiteit: O(n) waar n = aantal leerlingen
  Performance: ~1-5ms voor 500 leerlingen
*/
function filterLeerlingen() {
  // === STAP 1: Lees filter waarden ===
  const zoektekst = document.getElementById('searchInput').value.toLowerCase().trim();
  const klasFilter = document.getElementById('klasFilter').value;
  const lijst = document.getElementById('leerlingenLijst');
  const items = lijst.getElementsByTagName('li');

  // === STAP 2: Itereer door items en filter ===
  for (let i = 0; i < items.length; i++) {
    // Extraheer data-attributes en convert naar lowercase voor compare
    const klas = items[i].getAttribute('data-klas').toLowerCase();
    const naam = items[i].getAttribute('data-naam').toLowerCase();
    const tekst = `${naam} ${klas}`;

    // Controleer search text match (leeg = match alles)
    const matchText = zoektekst === '' || tekst.includes(zoektekst);
    
    // Specifiek filter voor klas 3 of 4
    let matchKlas = false;
    if (klasFilter === '') {
      matchKlas = true;
    } else if (klasFilter === '3') {
      matchKlas = klas.startsWith('3');
    } else if (klasFilter === '4') {
      matchKlas = klas.startsWith('4');
    } else {
      matchKlas = klas === klasFilter.toLowerCase();
    }

    // Wij item als beide filters matchen, anders verbergen
    items[i].style.display = (matchText && matchKlas) ? '' : 'none';
  }
}

function setClassFilter(value) {
  document.getElementById('klasFilter').value = value;
  filterLeerlingen();
}
</script>

{% endblock %}
