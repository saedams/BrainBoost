<!DOCTYPE html>
<html>
  <head>
    <!-- Meta charset and viewport for responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title (can be overwritten per template) -->
    <title>{% block title %}ANSW project{% endblock %}</title>
    
    <!-- Link to global stylesheet -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>

    <!-- ===== SIDEBAR NAVIGATION ===== -->
    <aside class="sidebar">
      <!-- Application branding/name -->
      <div class="brand">Brain Boost</div>
      
      <!-- Navigation menu list -->
      <ul class="sidebar-list">
        <li><a href="{{ url_for('main.index') }}">Home</a></li>
        <li><a href="{{ url_for('events.index') }}">Events</a></li>
        <li><a href="{{ url_for('main.fout_analyse', leerling_id=current_leerling_id) }}">Foutenanalyse</a></li>
        <li><a href="{{ url_for('main.aanbevelingen', leerling_id=current_leerling_id) }}">Aanbevelingen</a></li>
        <li><a href="{{ url_for('main.leerlingen', leerling_id=current_leerling_id) }}">leerling </a></li>
         <li><a href="{{ url_for('main.score', leerling_id=current_leerling_id) }}">Score</a></li>
        <li><a href="{{ url_for('contact.contact') }}">Contact & Support</a></li>
       
        
        <!-- Logout link (only if logged in) -->
        {% if session.get('role') %}
          <li><a href="{{ url_for('main.logout') }}">Uitloggen ({{ session.get('role') }})</a></li>
        {% endif %}
      </ul>
    </aside>

    <!-- ===== MAIN CONTENT AREA ===== -->
    <main class="main">
      <!-- Page header (optional per template) -->
      <header>
        {% block header %}{% endblock %}
      </header>

      <!-- Page content (required per template) -->
      <div>
        {% block content %}{% endblock %}
      </div>

      <!-- Footer -->
      <footer></footer>
    </main>

  </body>
</html>
